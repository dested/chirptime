[package]
name = "chirptime"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
urlencoding = "2"
warp = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "chirptime_lib"
crate-type = ["lib", "cdylib", "staticlib"]
