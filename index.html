<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #09090b;
      color: #fafafa;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    .date-sidebar {
      background: #0c0c0f;
      border-right: 1px solid rgba(255,255,255,0.04);
    }

    .date-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #a1a1aa;
      transition: all 0.12s ease;
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .date-btn:hover { background: rgba(255,255,255,0.03); color: #d4d4d8; }
    .date-btn-active {
      background: rgba(14, 165, 233, 0.12) !important;
      color: #38bdf8 !important;
      border-color: rgba(14, 165, 233, 0.2) !important;
    }

    .timeline-bar {
      background: #0c0c0f;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .timeline-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: #71717a;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.12s ease;
      cursor: pointer;
    }
    .timeline-btn:hover { color: #a1a1aa; background: rgba(255,255,255,0.03); }
    .timeline-btn-active {
      color: #38bdf8 !important;
      background: rgba(14, 165, 233, 0.1) !important;
      border-color: rgba(14, 165, 233, 0.15) !important;
    }

    .video-container {
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .video-container video, .video-container img {
      width: 100%;
      display: block;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    video::-webkit-media-controls-panel {
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
    }

    .controls-bar {
      background: #0c0c0f;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .monitor-btn, .speed-btn {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #71717a;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.12s ease;
      cursor: pointer;
    }
    .monitor-btn:hover, .speed-btn:hover {
      color: #a1a1aa;
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.08);
    }
    .monitor-btn-active {
      color: #38bdf8 !important;
      background: rgba(14, 165, 233, 0.1) !important;
      border-color: rgba(14, 165, 233, 0.2) !important;
    }

    .speed-btn {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      padding: 3px 8px;
    }
    .speed-btn-active {
      color: #a78bfa !important;
      background: rgba(139, 92, 246, 0.1) !important;
      border-color: rgba(139, 92, 246, 0.2) !important;
    }

    .webcam-float {
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      border-radius: 8px;
    }
    .webcam-header {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .capture-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot-active { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot-inactive { background: #71717a; }

    .delete-btn {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      color: #71717a;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .action-btn {
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
      border: 1px solid;
    }
    .action-btn-primary {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.2);
    }
    .action-btn-primary:hover {
      background: rgba(34, 197, 94, 0.2);
    }
    .action-btn-danger {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .action-btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }
    .action-btn-neutral {
      color: #a1a1aa;
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.06);
    }
    .action-btn-neutral:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse { animation: pulse-subtle 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/ui/main.tsx"></script>
</body>
</html>
