<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export</title>
<link rel="stylesheet" href="ct.css">
<script src="data.js"></script>
<script src="ct.js"></script>
<style>
  .win { width: 1280px; height: 800px; background: var(--paper); color: var(--ink); }
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 60px; background: #EFECE5; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 16px 0 14px; gap: 6px; }
  .ricon { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); }
  .ricon.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); white-space: nowrap; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .panel { position: absolute; right: 24px; top: 72px; width: 356px; bottom: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .sec { padding: 10px 16px 12px; border-bottom: 1px solid var(--line-2); }
  .h { font-size: 13px; font-weight: 700; display: flex; align-items: center; }
  .h .r { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--ink-3); }
  .preset { height: 50px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  .preset.on { border-color: var(--ink); color: var(--ink); background: var(--card); box-shadow: 0 0 0 1px var(--ink) inset; }
  .glyph { background: var(--sunk); border-radius: 2px; position: relative; display: block; }
  .glyph i { position: absolute; background: var(--ink-4); border-radius: 1px; display: block; }
  .preset.on .glyph i { background: var(--canary-deep); }
  .seg { display: flex; padding: 2px; border-radius: 8px; background: var(--sunk); }
  .seg button { flex: 1; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .lbl { font-size: 12px; color: var(--ink-2); width: 58px; flex-shrink: 0; }
  .slider { position: relative; height: 4px; border-radius: 2px; background: var(--sunk); flex: 1; }
  .slider b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--ink); }
  .slider i { position: absolute; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); margin-left: -8px; box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.18); }
  .tg { width: 30px; height: 18px; border-radius: 9px; background: var(--ink); position: relative; flex-shrink: 0; }
  .tg::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .tg.off { background: var(--ink-4); }
  .tg.off::after { right: auto; left: 2px; }
  .tick { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); position: absolute; white-space: nowrap; }
</style>
</head>
<body>
<div class="win" id="win">
  <aside class="rail">
    <div style="margin-bottom:12px" id="mk"></div>
    <button class="ricon on" title="Library"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></button>
    <button class="ricon" title="Marks"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4h12l-2 4 2 4H5"/></svg></button>
    <button class="ricon" title="Exports"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg></button>
    <button class="ricon" title="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <div style="flex:1"></div>
    <button class="ricon" title="Not recording · Start"><span style="width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-3)"></span></button>
  </aside>
  <div style="position:absolute;left:84px;top:0;width:1172px;height:64px;display:flex;align-items:center;gap:12px">
    <button class="btn ghost" style="padding:0 8px 0 4px;margin-left:-6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Saturday, August 1</button>
    <div style="width:1px;height:20px;background:var(--line)"></div>
    <div style="font-size:20px;font-weight:700;letter-spacing:-.02em">Export</div>
    <div class="mono" style="font-size:11.5px;color:var(--ink-3)">12:10 PM – 12:34 PM · 24 min</div>
  </div>
  <div id="stage"></div>
  <aside class="panel" id="panel"></aside>
</div>
<script>
(() => {
  document.getElementById("mk").innerHTML = CT.mark(20);
  const add = (parent, html) => { const n = CT.el(html); parent.appendChild(n); return n; };
  const st = document.getElementById("stage");
  const down = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;

  /* ---- preview: the output frame on the dark mat, everything else Paper ---- */
  const px = 84, py = 72, mw = 792, pad = 12, fw = mw - pad * 2, fh = Math.round(fw * 9 / 16);
  const mh = fh + pad * 2;
  add(st, `<div style="position:absolute;left:${px}px;top:${py}px;width:${mw}px;height:${mh}px;background:var(--mat);border-radius:12px;overflow:hidden">
    <div style="position:absolute;left:${pad}px;top:${pad}px;width:${fw}px;height:${fh}px;overflow:hidden;border-radius:3px;background:#000">
      <img src="assets/hero-screen-0-12.jpg" style="position:absolute;height:100%;left:${-fw * 0.21}px;width:${fh * 5120 / 2160}px;object-fit:cover">
      <div style="position:absolute;right:20px;bottom:20px;width:${Math.round(fw * .28)}px;height:${Math.round(fw * .28 * 9 / 16)}px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--canary),0 10px 30px rgba(0,0,0,.5)">
        <img src="assets/hero-webcam-12.jpg" style="width:100%;height:100%;object-fit:cover">
        <span style="position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:3px 0 10px 0;background:var(--canary)"></span>
      </div>
    </div></div>`);
  add(st, `<div style="position:absolute;left:${px}px;top:${py + mh + 10}px;width:${mw}px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)">
    <span class="mono" style="color:var(--ink-2)">1920 × 1080 · 12:14:02 PM</span>
    <span style="margin-left:auto">The 16:9 window follows your cursor on the ultrawide · drag the camera to move it</span></div>`);

  /* ---- the range, as the same calm strip the player uses ---- */
  const D = window.DAY, S = D.start;
  const T = (h, m) => new Date(2026, 7, 1, h, m).getTime();
  const a = T(12, 0), b = T(12, 45), rx = px, rw = mw, ry = py + mh + 74, rh = 48;
  const X = (t) => rx + ((t - a) / (b - a)) * rw;
  add(st, `<div style="position:absolute;left:${rx}px;top:${ry - 24}px;font-size:13px;font-weight:700">Range</div>`);
  const strip = add(st, `<div style="position:absolute;left:${rx}px;top:${ry}px;width:${rw}px;height:${rh}px;border-radius:7px;overflow:hidden;background:var(--sunk)"></div>`);
  for (let f = 9; f <= 13; f++) {
    const t0 = S + f * 600000, x0 = Math.max(rx, X(t0)), x1 = Math.min(rx + rw, X(t0 + 600000));
    if (x1 - x0 < 2) continue;
    add(strip, `<div style="position:absolute;left:${x0 - rx}px;top:0;width:${x1 - x0 - 1}px;height:${rh}px;overflow:hidden"><img src="assets/day/screen-0-${CT.p2(f)}.jpg" style="position:absolute;left:${X(t0) - x0}px;width:${X(t0 + 600000) - X(t0)}px;height:100%;object-fit:cover"></div>`);
  }
  const s0 = X(T(12, 10)), s1 = X(T(12, 34));
  add(strip, `<div style="position:absolute;left:0;top:0;width:${s0 - rx}px;height:${rh}px;background:rgba(245,243,238,.6)"></div>`);
  add(strip, `<div style="position:absolute;left:${s1 - rx}px;top:0;width:${rx + rw - s1}px;height:${rh}px;background:rgba(245,243,238,.6)"></div>`);
  add(st, `<div style="position:absolute;left:${s0 - 2}px;top:${ry - 3}px;width:${s1 - s0 + 4}px;height:${rh + 6}px;border:2.5px solid var(--canary-deep);border-radius:8px"></div>`);
  add(st, `<div style="position:absolute;left:${X(T(12, 14)) - 1}px;top:${ry - 4}px;width:2px;height:${rh + 8}px;background:var(--ink)"></div>`);
  for (const [t, lab] of [[T(12, 10), "12:10:00 PM"], [T(12, 34), "12:34:00 PM"]]) {
    add(st, `<div class="mono" style="position:absolute;left:${X(t) - 40}px;top:${ry + rh + 6}px;width:80px;height:20px;border-radius:6px;background:var(--canary);color:var(--canary-ink);font-size:11px;font-weight:600;display:grid;place-items:center">${lab}</div>`);
  }
  add(st, `<div class="tick" style="left:${rx}px;top:${ry + rh + 9}px">12:00</div>`);
  add(st, `<div class="tick" style="left:${rx + rw - 30}px;top:${ry + rh + 9}px">12:45</div>`);

  /* ---- panel ---- */
  const P = document.getElementById("panel");
  const glyph = (w, h, rects) => `<span class="glyph" style="width:${w}px;height:${h}px">${rects.map(([l, t, ww, hh]) => `<i style="left:${l}px;top:${t}px;width:${ww}px;height:${hh}px"></i>`).join("")}</span>`;
  add(P, `<div class="sec"><div class="h">Layout<span class="r">16:9</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px">
      <button class="preset on">${glyph(30, 17, [[19, 9, 9, 6]])}Devlog</button>
      <button class="preset">${glyph(12, 22, [[2, 2, 8, 8]])}Short</button>
      <button class="preset">${glyph(30, 17, [[1, 1, 13, 15], [16, 1, 13, 15]])}Side by side</button>
      <button class="preset">${glyph(30, 13, [[1, 6, 8, 6], [10, 6, 10, 6], [21, 6, 8, 6], [2, 1, 6, 4]])}Desk</button>
    </div></div>`);
  add(P, `<div class="sec"><div class="h">Screen</div>
    <div class="seg" style="margin-top:10px"><button class="on">Follow mouse</button><button>1</button><button>2</button><button>3</button><button>4</button></div></div>`);
  add(P, `<div class="sec"><div class="h">Camera<span class="tg" style="margin-left:auto"></span></div>
    <div class="row"><span class="lbl">Corner</span>
      <div style="display:grid;grid-template-columns:repeat(2,20px);gap:3px">${[0, 0, 0, 1].map((on) => `<span style="height:12px;border-radius:3px;background:${on ? "var(--canary-deep)" : "var(--sunk)"};border:1px solid ${on ? "var(--canary-deep)" : "var(--line)"}"></span>`).join("")}</div>
      <div class="seg" style="margin-left:auto;width:150px"><button class="on">Rounded</button><button>Circle</button></div></div>
    <div class="row"><span class="lbl">Size</span><div class="slider"><b style="width:28%"></b><i style="left:28%"></i></div><span class="mono" style="font-size:11px;color:var(--ink-2);width:30px;text-align:right">28%</span></div>
  </div>`);
  add(P, `<div class="sec"><div class="h">Sound</div>
    <div class="row"><span class="lbl">Mic</span><div class="slider"><b style="width:80%"></b><i style="left:80%"></i></div><span class="mono" style="font-size:11px;color:var(--ink-2);width:30px;text-align:right">0 dB</span></div>
    <div class="row"><span class="lbl">System</span><div class="slider"><b style="width:46%"></b><i style="left:46%"></i></div><span class="mono" style="font-size:11px;color:var(--ink-2);width:30px;text-align:right">−12</span></div>
    <div class="row" style="font-size:12px;color:var(--ink-2)"><span class="tg"></span>Lower system audio while I talk</div>
  </div>`);
  add(P, `<div class="sec"><div class="h">Speed</div>
    <div class="seg" style="margin-top:10px"><button class="on">1×</button><button>2×</button><button>4×</button><button>Timelapse</button></div>
    <div class="row" style="font-size:12px;color:var(--ink-2)"><span class="tg"></span>Skip idle stretches</div>
  </div>`);
  add(P, `<div class="sec" style="border-bottom:0"><div class="h">Size</div>
    <div class="seg" style="margin-top:10px"><button>Original</button><button class="on">1080p</button><button>Share · 25 MB</button></div>
  </div>`);
  add(P, `<div style="flex:1"></div>`);
  add(P, `<div style="padding:12px 16px 14px;border-top:1px solid var(--line-2)">
    <div style="display:flex;align-items:center;font-size:12px;color:var(--ink-3)"><span>Composed MP4 · about 1.9 GB · 4 min</span><button style="margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px">Raw tracks${down}</button></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="flex:1;height:40px;justify-content:center;background:var(--ink);color:#fff;border-color:var(--ink);font-size:13.5px">Export 24 minutes</button>
      <button class="btn" style="height:40px">Save preset</button>
    </div>
  </div>`);
})();
</script>
</body>
</html>
